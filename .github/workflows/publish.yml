name: Upload Crates.io Package

on:
  push:
    tags:
      - v*.*.*
  # Build artifacts and create the GitHub release for an already published
  # tag, without publishing to crates.io again.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v2.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [ ubuntu-latest, macOS-latest, "windows-latest" ]
        rust:
          - stable
        args:
          - '--no-default-features'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo fetch
      - run: cargo build --tests ${{ matrix.args }}
      - run: cargo test ${{ matrix.args }}

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2

  publish_check:
    name: Publish check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
      - run: cargo fetch
      - run: cargo publish --dry-run --no-default-features
      - run: cargo doc --no-deps --no-default-features

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [ test, cargo-deny, publish_check ]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
      - run: cargo fetch
      - run: cargo publish --no-default-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  build_artifacts:
    name: Build artifacts
    needs: [ test, cargo-deny, publish_check ]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: "--no-default-features --features bin,onepkg"
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--no-default-features --features bin,onepkg"
            archive_ext: zip
          - os: macOS-latest
            target: aarch64-apple-darwin
            args: "--no-default-features --features bin,onepkg"
            archive_ext: tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} ${{ matrix.args }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          bin="one2html"
          archive="one2html-${{ matrix.target }}.${{ matrix.archive_ext }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${bin}" "dist/${bin}"
          tar -C dist -czf "${archive}" "${bin}"
          shasum -a 256 "${archive}" > "${archive}.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "one2html.exe"
          $archive = "one2html-${{ matrix.target }}.${{ matrix.archive_ext }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$bin" "dist/$bin"
          Compress-Archive -Path "dist/$bin" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$hash  $archive" | Out-File -FilePath "$archive.sha256" -Encoding ascii
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: one2html-${{ matrix.target }}
          path: |
            one2html-${{ matrix.target }}.${{ matrix.archive_ext }}
            one2html-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [ publish, build_artifacts ]
    # `publish` is skipped on manual dispatch, so don't require it to succeed.
    if: >-
      ${{ !cancelled()
      && needs.build_artifacts.result == 'success'
      && needs.publish.result != 'failure' }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Extract release notes
        uses: ffurrer2/extract-release-notes@273da39a24fb7db106a35526c8162815faffd31d # v3
        with:
          release_notes_file: release-notes.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: false
